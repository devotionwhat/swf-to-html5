<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flash Games Archive - SWF to HTML5</title>
    <link rel="stylesheet" type="text/css" href="css/auroral2.css">
    <link rel="stylesheet" href="css/cards.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .auroral-info {
            position: relative;
            z-index: 10;
            padding: 20px;
        }
        .auroral-info h1 {
            color: white;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }
        .auroral-info .subtitle {
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 20px;
        }
        .category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .category-nav a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .category-nav a:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .category-section {
            margin-bottom: 40px;
            padding: 0 20px;
        }
        .category-header {
            color: white;
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .category-header .count {
            font-size: 0.5em;
            opacity: 0.7;
        }
        .cards-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            aspect-ratio: 3/4;
            position: relative;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card_image {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .card_image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card_title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }
        .card_title p {
            color: white;
            font-size: 14px;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .stats {
            text-align: center;
            color: rgba(255,255,255,0.7);
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auroral-info">
        <h1>🎮 Flash Games Archive</h1>
        <p class="subtitle">Classic Flash Games Preserved with Ruffle Emulator</p>
        
        <div class="category-nav">
        </div>
        
        <div class="cards-list">
        </div>
        
        <div class="stats">
            <p>Total Games: 0 | Powered by Ruffle Flash Emulator</p>
        </div>
    </div>
    
    <!-- Background Effects -->
    <div class="container">
        <div id="northern" class="auroral auroral-northern"></div>
        <div id="northern-intense" class="auroral auroral-northern-intense"></div>
        <div id="northern-dimmed" class="auroral auroral-northern-dimmed"></div>
        <div class="auroral-stars"></div>
    </div>
</body>
</html>
