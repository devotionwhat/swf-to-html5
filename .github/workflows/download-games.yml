name: Download Flash Games

on:
  workflow_dispatch:
    inputs:
      max_games_per_category:
        description: 'Maximum games to download per category'
        required: false
        default: '100'
      categories:
        description: 'Categories to download (comma-separated, or "all")'
        required: false
        default: 'all'
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    paths:
      - 'TRIGGER_DOWNLOAD'

permissions:
  contents: write

jobs:
  download-games:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pillow
      
      # Download Ruffle for thumbnail generation
      - name: Download Ruffle exporter
        run: |
          mkdir -p ~/ruffle
          cd ~/ruffle
          wget -q https://github.com/ruffle-rs/ruffle/releases/download/nightly-2024-01-15/ruffle-exporter-linux-x86_64.tar.gz
          tar -xzf ruffle-exporter-linux-x86_64.tar.gz
          chmod +x exporter
          
      - name: Download SWF files from Archive.org
        env:
          MAX_PER_CATEGORY: ${{ github.event.inputs.max_games_per_category || '100' }}
          CATEGORIES: ${{ github.event.inputs.categories || 'all' }}
        run: |
          python3 scripts/download_games.py --max-per-category $MAX_PER_CATEGORY --categories "$CATEGORIES"
      
      - name: Generate thumbnails
        run: |
          echo "Generating thumbnails with Ruffle exporter..."
          for swf in $(find assets -name "*.swf" -type f); do
            png="${swf}.png"
            if [ ! -f "$png" ]; then
              echo "  Thumbnail: $swf"
              timeout 10s ~/ruffle/exporter "$swf" "$png" --frame 100 2>/dev/null || echo "    (skipped)"
            fi
          done
      
      - name: Generate HTML wrappers
        run: |
          python3 scripts/generate_html.py
      
      - name: Check total size
        id: size
        run: |
          TOTAL=$(du -sm assets | cut -f1)
          echo "total_size=$TOTAL" >> $GITHUB_OUTPUT
          echo "Current size: ${TOTAL} MB"
          
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Add flash games and thumbnails [skip ci]"
          git push
