name: Download Flash Games

on:
  workflow_dispatch:
    inputs:
      max_games_per_category:
        description: 'Maximum games to download per category'
        required: false
        default: '1000'
      categories:
        description: 'Categories to download (comma-separated, or "all")'
        required: false
        default: 'all'
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - master
    paths:
      - 'TRIGGER_DOWNLOAD'

permissions:
  contents: write

jobs:
  download-games:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Download SWF files
        env:
          MAX_PER_CATEGORY: ${{ github.event.inputs.max_games_per_category || '1000' }}
          CATEGORIES: ${{ github.event.inputs.categories || 'all' }}
        run: python3 scripts/download_games.py --max-per-category $MAX_PER_CATEGORY --categories "$CATEGORIES"
      
      - name: Generate HTML wrappers
        run: python3 scripts/generate_html.py
      
      - name: Check progress
        run: |
          TOTAL=$(du -sm assets | cut -f1)
          COUNT=$(find assets -name "*.swf" | wc -l)
          echo "📊 Progress: ${COUNT} games, ${TOTAL} MB"
          echo "Target: 4096 MB (4 GB)"
          echo "Progress: $(python3 -c "print(f'{$TOTAL/4096*100:.1f}%')")"
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Add flash games [skip ci]"
          git push
