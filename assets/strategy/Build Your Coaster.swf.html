<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Build Your Coaster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #game-container { 
            width: 100vw; 
            height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            text-decoration: none;
        }
        #back-btn:hover { background: rgba(255,255,255,0.3); }
        embed { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <a href="../../index.html" id="back-btn">← Back to Games</a>
    <div id="game-container">
        <embed src="./Build Your Coaster.swf" type="application/x-shockwave-flash" width="100%" height="100%">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/ruffle-mirror@latest/ruffle.js"></script>
</body>
</html>
