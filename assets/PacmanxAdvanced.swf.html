<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacmanxAdvanced - Tesla Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Lato', sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
        }
        .back-btn:hover {
            background: #f49324;
            border-color: #f49324;
            transform: translateX(-3px);
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        .game-title {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 8px 24px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(244, 147, 36, 0.3);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }
        .fullscreen-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .fullscreen-btn:hover {
            background: #f49324;
            border-color: #f49324;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <a href="../index.html" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        BACK
    </a>
    <div class="game-title">PacmanxAdvanced</div>
    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>

    <script src="../ruffle_web_latest/ruffle.js"></script>
    <script>
        // Launch game with Ruffle
        window.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('game-container');
            try {
                var ruffle = window.RufflePlayer.newest();
                var player = ruffle.createPlayer();
                player.style.width = '100%';
                player.style.height = '100%';
                container.appendChild(player);
                player.load({ url: '../assets/PacmanxAdvanced.swf' });
            } catch (e) {
                // Fallback to embed
                container.innerHTML = '<embed src="../assets/PacmanxAdvanced.swf" width="100%" height="100%">';
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Auto-hide controls after 3 seconds of no mouse movement
        var controls = document.querySelectorAll('.back-btn, .game-title, .fullscreen-btn');
        var hideTimer;
        function showControls() {
            controls.forEach(function(el) { el.style.opacity = '1'; });
            clearTimeout(hideTimer);
            hideTimer = setTimeout(function() {
                controls.forEach(function(el) { el.style.opacity = '0.15'; });
            }, 3000);
        }
        document.addEventListener('mousemove', showControls);
        showControls();
    </script>
</body>
</html>
